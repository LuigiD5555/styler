schema_version = 1
id = "app.dolphin"
name = "Dolphin"
kind = "application"
description = "Gestor de archivos de KDE."
capability_alias = "application.dolphin"

requires = []
provides = ["app.dolphin.installed", "app.dolphin.verified"]
criticality = "optional"

[resources]
exclusive = ["apt", "dpkg"]
shared = ["network"]

[providers.apt]
type = "apt"
families = ["ubuntu", "debian"]
packages = ["dolphin"]
config_root = "${HOME}/.config"
priority = 100

[providers.pacman]
type = "pacman"
families = ["arch"]
packages = ["dolphin"]
config_root = "${HOME}/.config"
priority = 100

[providers.rpm]
type = "rpm"
families = ["fedora"]
packages = ["dolphin"]
config_root = "${HOME}/.config"
priority = 100

[providers.zypper]
type = "zypper"
families = ["suse"]
packages = ["dolphin"]
config_root = "${HOME}/.config"
priority = 100

[providers.flatpak]
type = "flatpak"
families = ["*"]
application_id = "org.kde.dolphin"
config_root = "${HOME}/.var/app/org.kde.dolphin"
priority = 80

[verification]
checks = ["executable:dolphin"]

[rollback]
level = "best_effort"
strategy = "provider_remove"

[compatibility]
wayland = "supported"
xwayland = "supported"
x11 = "supported"
