# Equivalencias conocidas de aplicaciones entre gestores.
#
# NO es una lista obligatoria: si una aplicación no aparece aquí, Styler la
# DESCUBRE preguntándole al gestor del equipo destino (pacman -Si, dnf list,
# apt-cache policy, flatpak remote-info...). Este catálogo solo sirve para los
# casos donde el nombre cambia entre distribuciones.
[[application]]
identity = "org.kde.krita"
title = "Krita"
names = { apt = "krita", pacman = "krita", dnf = "krita", zypper = "krita", flatpak = "org.kde.krita" }

