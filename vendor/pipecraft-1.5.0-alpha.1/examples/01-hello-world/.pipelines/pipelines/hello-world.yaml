schema_version: pipecraft/v1
name: hello-world
description: |
  The smallest possible pipeline. A note, a command (dry-run by default),
  and a checklist. Run it with:
    pipecraft run hello-world --root examples/01-hello-world

repos:
  current:
    path: .
    visibility: local

steps:
  - id: say_hello
    type: note
    description: This step just leaves a note in the run report. No side effects.

  - id: show_date
    type: command
    repo: current
    needs: [say_hello]
    description: |
      Dry-run by default: this step PLANS the command but does not execute it
      unless you pass --execute. argv form (shell: false) is the safe default.
    with:
      argv: ["date"]

  - id: confirm_setup
    type: checklist
    needs: [show_date]
    description: Human checklist, rendered into the run report as markdown.
    with:
      items:
        - Did the command step show the right plan?
        - Did the run report get written to .pipelines/runs/?

on_error:
  default: stop
