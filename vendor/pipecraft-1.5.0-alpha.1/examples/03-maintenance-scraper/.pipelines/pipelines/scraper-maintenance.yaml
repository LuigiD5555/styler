schema_version: pipecraft/v1
name: scraper-maintenance
description: |
  Example shape for Selenium/web-scraper maintenance. It does not require
  Selenium; swap the echo commands for real Python/Node/Rust scripts.

repos:
  current:
    path: .
    visibility: local

steps:
  - id: describe
    type: note
    description: Browser/scraper pipelines need retries, timeouts, logs and artifacts.

  - id: inspect_worktree
    type: git_diff
    repo: current
    needs: [describe]
    description: Read-only git status before running a fragile automation.
    with:
      mode: status
      timeout: 10

  - id: download_page
    type: command
    repo: current
    needs: [inspect_worktree]
    description: Replace this with your Selenium/Playwright entrypoint.
    with:
      argv: ["echo", "<selenium: login -> wait -> download -> screenshot on failure>"]
      timeout: 60
      retries: 2
      retry_delay: 2

  - id: parse_downloads
    type: plugin
    repo: current
    needs: [download_page]
    description: Example polyglot plugin slot. Replace argv with python/node/rust helper.
    with:
      argv: ["echo", "{\"success\":true,\"status\":\"ok\",\"message\":\"parsed\",\"output\":\"records=0\",\"data\":{\"records\":0}}"]
      timeout: 30

  - id: validate_outputs
    type: boundary_check
    repo: current
    needs: [parse_downloads]
    description: Guard against accidentally committing credentials or browser dumps.
    rules:
      forbidden_paths:
        - "**/.env*"
        - "**/secrets/**"
      forbidden_terms:
        - "PASSWORD="
        - "AWS_SECRET_ACCESS_KEY="

on_error:
  default: stop
