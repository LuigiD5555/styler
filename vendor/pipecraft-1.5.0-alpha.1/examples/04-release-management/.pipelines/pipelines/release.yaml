schema_version: pipecraft/v1
name: release
description: |
  Cut a versioned release safely. Validates the tree, confirms the release
  checklist, plans the release target, then gates the tag/publish behind an
  explicit human approval. Dry-run by default: nothing is tagged or pushed
  unless you pass --execute --approve.

context:
  mode: release
  channel: stable

repos:
  current:
    path: .
    visibility: local

target:
  repo: current
  branch: main
targets:
  stable:
    branch: main
    channel: stable
  beta:
    branch: develop
    channel: beta

steps:
  - id: release_checklist
    type: checklist
    description: Confirm the human-judgment items a tool can't verify.
    with:
      items:
        - "CHANGELOG updated with the new version's notes"
        - "Version bumped in the manifest/package metadata"
        - "Breaking changes documented and migration notes written"
        - "No open release-blocker issues"

  - id: clean_tree
    type: file_check
    repo: current
    description: No stray secrets or build junk in the release tree.
    rules:
      forbidden_paths:
        - "**/.env*"
        - "**/*.pem"
        - "**/dist/**.map"
      ignore_paths:
        - "**/.git/**"
        - "**/target/**"

  - id: run_tests
    type: command
    repo: current
    needs: [clean_tree]
    description: Full suite must pass before a release is cut.
    with:
      argv: ["echo", "<tests: e.g. cargo test / pytest -q / npm test>"]
      timeout: 1200

  - id: build_release
    type: command
    repo: current
    needs: [run_tests, release_checklist]
    description: Produce the release artifact(s).
    with:
      argv: ["echo", "<build: e.g. cargo build --release / npm run build>"]

  - id: plan_release
    type: target_plan
    needs: [build_release]
    description: Show the release target (branch/channel) before tagging.
    with:
      target: stable

  - id: approve_release
    type: manual_approval
    needs: [plan_release]
    description: Final human sign-off before the release becomes public.
    requires_approval: true

  - id: tag_and_publish
    type: command
    repo: current
    needs: [approve_release]
    requires_approval: true
    description: |
      Only runs with --execute --approve. Swap argv for your real release
      command (git tag + push, gh release create, cargo publish, etc.).
    with:
      argv: ["echo", "<release: e.g. git tag vX.Y.Z && git push --tags>"]

on_error:
  default: stop
