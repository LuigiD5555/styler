schema_version: pipecraft/v1
name: lite-boundary
description: |
  Open-core boundary guard for a Lite/Pro (community/commercial) split.

  Before publishing the LITE edition, prove that no Pro-only code, files, or
  markers leaked into the public tree. This is the V1, dependency-free way to
  enforce an edition boundary: boundary_check scans the working tree for forbidden
  paths and forbidden terms, target_plan describes the edition target without
  touching it, and manual_approval forces a human sign-off before publish.

  V1.1 uses the dedicated `boundary_check` executor and can combine it with
  `copy_or_sync` for edition extraction. See docs/v1_1-executors.md.

context:
  edition: lite
  mode: pre_publish_validation

repos:
  public:
    path: .
    visibility: local

# Declarative description of where the Lite edition is published.
# target_plan only *reports* this; it never commits, pushes, or syncs.
target:
  repo: public
  edition: lite
  visibility: public
targets:
  lite:
    branch: release/lite
    visibility: public
  pro:
    branch: release/pro
    visibility: private

steps:
  - id: describe_target
    type: note
    description: State the intent of this run so the report is self-explanatory.
    with:
      text: >
        Validating the LITE (community) edition boundary before publishing to a
        public repository. Nothing is committed or pushed by this pipeline.

  - id: no_pro_files
    type: boundary_check
    repo: public
    description: Pro-only files must never appear in the public Lite tree.
    rules:
      forbidden_paths:
        - "**/pro/**"
        - "**/*_pro.py"
        - "**/license_key*.py"
        - "**/edition_adapter/**"
        - "**/*.opl"            # OPL-1 / commercial license artifacts
      ignore_paths:
        - "**/.git/**"
        - "**/target/**"
        - "**/node_modules/**"

  - id: no_pro_markers
    type: boundary_check
    repo: public
    needs: [no_pro_files]
    description: |
      Pro code is fenced with explicit markers during development. If a marker
      survives into the Lite tree, the boundary extraction was incomplete.
    rules:
      forbidden_terms:
        - "PRO-ONLY"
        - "pragma: pro"
        - "OPL-1"
        - "require_pro_license("
      ignore_paths:
        - "**/.git/**"
        - "**/target/**"
      max_findings: 50

  - id: license_present
    type: boundary_check
    repo: public
    needs: [no_pro_files]
    description: The Lite edition must ship LGPL-3, not the commercial license.
    rules:
      # Reuse forbidden_terms as a negative guard: a commercial header here is a leak.
      forbidden_terms:
        - "Odoo Proprietary License v1.0 (OPL-1)"
      ignore_paths:
        - "**/.git/**"

  - id: plan_publish
    type: target_plan
    needs: [no_pro_markers, license_present]
    description: Show exactly where the Lite edition would be published.
    with:
      target: lite

  - id: approve_publish
    type: manual_approval
    needs: [plan_publish]
    description: Human confirms the boundary is clean before publishing.
    requires_approval: true

  - id: publish_lite
    type: command
    repo: public
    needs: [approve_publish]
    requires_approval: true
    description: |
      Placeholder publish step. Only runs with --execute --approve.
      Swap argv for your real publish (git push to the public mirror,
      `twine upload`, `npm publish`, an Odoo module upload, etc.).
    with:
      argv: ["echo", "<publish lite edition: e.g. git push public release/lite>"]

on_error:
  default: stop
