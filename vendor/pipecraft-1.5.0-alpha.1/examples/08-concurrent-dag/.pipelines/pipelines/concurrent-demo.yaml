schema_version: pipecraft/v1
name: concurrent-demo
description: Demonstrates real DAG scheduling without assuming any domain.

steps:
  - id: prepare
    type: note
    description: Prepare the run.
    provides: [input.ready]

  - id: branch_a
    type: command
    needs: [prepare]
    requires: [input.ready]
    shared_resources: [network]
    with:
      argv: ["sh", "-c", "echo A; sleep 1; echo A-done"]
      inactivity_timeout: 10

  - id: branch_b
    type: command
    needs: [prepare]
    requires: [input.ready]
    shared_resources: [network]
    with:
      argv: ["sh", "-c", "echo B; sleep 1; echo B-done"]
      inactivity_timeout: 10

  - id: finalize
    type: checklist
    needs: [branch_a, branch_b]
    barrier: true
    with:
      items:
        - Both independent branches completed.
        - Inspect report.json and events.jsonl.
