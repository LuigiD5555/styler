[workspace]
resolver = "2"
members = [
    "crates/pipecraft-core",
    "crates/pipecraft-graph",
    "crates/pipecraft-report",
    "crates/pipecraft-runtime",
    "crates/pipecraft-service",
    "crates/pipecraft-cli",
]

[workspace.package]
version = "1.5.0-alpha.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/LuigiD5555/pipecraft"
description = "An adaptive, local-first, polyglot pipeline runtime driven by YAML."

# Versions follow the roadmap's suggested V1 dependency set.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
globset = "0.4"
camino = "1"
libc = "0.2"
ctrlc = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "io-util", "fs", "macros", "net", "signal"] }

# Internal crates referenced by path.
pipecraft-core = { path = "crates/pipecraft-core" }
pipecraft-graph = { path = "crates/pipecraft-graph" }
pipecraft-report = { path = "crates/pipecraft-report" }
pipecraft-runtime = { path = "crates/pipecraft-runtime" }
pipecraft-service = { path = "crates/pipecraft-service" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true
