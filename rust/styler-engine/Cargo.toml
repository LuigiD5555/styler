[package]
name = "styler-engine"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
description = "Motor Rust de planificación, ejecución transaccional, diagnóstico y escaneo para Styler"

[[bin]]
name = "styler-engine"
path = "src/main.rs"

[dependencies]
blake2 = "0.10"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2.5"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
