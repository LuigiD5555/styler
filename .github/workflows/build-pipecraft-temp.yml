name: Build PipeCraft x86_64 temp

on:
  pull_request:
    branches: [main]

jobs:
  build-pipecraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build PipeCraft 1.5.0-alpha.1
        run: cargo build --release --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml -p pipecraft-cli
      - name: Verify binary
        run: |
          vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft --version
          file vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft
          sha256sum vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft > pipecraft.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pipecraft-1.5.0-alpha.1-linux-x86_64
          path: |
            vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft
            pipecraft.sha256
          if-no-files-found: error
