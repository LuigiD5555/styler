name: Build PipeCraft 1.6 x86_64 temp

on:
  pull_request:
    branches: [main]

jobs:
  build-pipecraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply PipeCraft 1.6 source patch
        run: |
          cat .ci/pipecraft16/patch.part1 .ci/pipecraft16/patch.part2 .ci/pipecraft16/patch.part3 > /tmp/pipecraft.patch.gz
          gzip -dc /tmp/pipecraft.patch.gz > /tmp/pipecraft.patch
          git apply /tmp/pipecraft.patch
      - name: Check formatting
        run: cargo fmt --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --workspace
      - name: Build release
        run: cargo build --release --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml -p pipecraft-cli
      - name: Verify binary
        run: |
          vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft --version
          file vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft
          sha256sum vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft > pipecraft-1.6.0-alpha.1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pipecraft-1.6.0-alpha.1-linux-x86_64
          path: |
            vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft
            pipecraft-1.6.0-alpha.1.sha256
          if-no-files-found: error
