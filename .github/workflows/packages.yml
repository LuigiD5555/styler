name: Build packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        textual: ["0.89.1", "4.0.0", "7.2.0", "8.2.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/build-portable-runtime.sh
        env:
          STYLER_TEXTUAL_VERSION: ${{ matrix.textual }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.textual }}
          path: dist/

  deb:
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-release-deb.sh

  arch:
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-release-arch.sh

  rpm:
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-release-rpm.sh

  release:
    runs-on: ubuntu-latest
    needs: [deb, arch, rpm]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Release artifacts built"
