name: Build packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build Linux release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled PipeCraft runtime
        run: python scripts/verify-bundled-pipecraft.py
      - name: Verify architecture boundary
        run: python scripts/verify-runtime-boundary.py
      - name: Build portable runtime, DEB, Arch and RPM
        run: ./scripts/build-release-in-containers.sh all
      - name: Build source archive
        run: ./scripts/make-source-archive.sh
      - name: List artifacts
        run: find dist -maxdepth 4 -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: styler-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
