name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify-bundled-pipecraft.py
      - run: python scripts/verify-runtime-boundary.py
      - run: pytest -q

  styler-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path styler/rust_ext/Cargo.toml

  pipecraft-16-spec-ipc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Restore PipeCraft source from verified historical build
        shell: bash
        run: |
          set -euo pipefail
          git archive 62c3fdbee2d1df7e393330812a44542827c16489 vendor/pipecraft-1.5.0-alpha.1 | tar -x
          test -f vendor/pipecraft-1.5.0-alpha.1/Cargo.toml

      - name: Apply PipeCraft 1.6 structured-spec IPC implementation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_pipecraft_16_temp.py
          sed -i '/serde_json.workspace = true/a serde_yaml.workspace = true' vendor/pipecraft-1.5.0-alpha.1/crates/pipecraft-service/Cargo.toml

      - name: Format and test PipeCraft workspace
        run: |
          cargo fmt --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --all
          cargo fmt --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --all -- --check
          cargo test --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --workspace

      - name: Build PipeCraft 1.6.0-alpha.1
        run: cargo build --release --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml -p pipecraft-cli

      - name: Functional structured-spec IPC smoke test
        shell: bash
        run: |
          set -euo pipefail
          PC="$PWD/vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft"
          ROOT="$(mktemp -d)"
          mkdir -p "$ROOT/.pipelines/pipelines"
          "$PC" --version | grep -F '1.6.0-alpha.1'
          "$PC" serve --root "$ROOT" >"$ROOT/service.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            test -S "$ROOT/.pipelines/pipecraft.sock" && break
            sleep 0.05
          done
          test -S "$ROOT/.pipelines/pipecraft.sock"
          ROOT="$ROOT" python - <<'PY'
          import json, os, socket, time
          from pathlib import Path

          endpoint = Path(os.environ['ROOT']) / '.pipelines/pipecraft.sock'

          def call(payload):
              sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              sock.connect(str(endpoint))
              sock.sendall((json.dumps(payload, separators=(',', ':')) + '\n').encode())
              data = b''
              while not data.endswith(b'\n'):
                  chunk = sock.recv(65536)
                  if not chunk:
                      break
                  data += chunk
              sock.close()
              response = json.loads(data)
              assert response['ok'], response
              return response['data']

          spec = {
              'schema_version': 'pipecraft/v1',
              'name': 'ipc-smoke',
              'steps': [
                  {'id': 'a', 'type': 'note', 'with': {'message': 'a'}},
                  {'id': 'b', 'type': 'note', 'needs': ['a'], 'with': {'message': 'b'}},
              ],
          }

          ping = call({'op': 'ping'})
          assert ping['version'] == '1.6.0-alpha.1', ping
          assert {'submit_spec', 'validate_spec', 'plan_spec'} <= set(ping['capabilities']), ping

          validated = call({'op': 'validate_spec', 'spec': spec})
          assert validated['valid'] is True, validated

          planned = call({'op': 'plan_spec', 'spec': spec})
          assert planned['order'] == ['a', 'b'], planned
          assert planned['selected'] == ['a', 'b'], planned

          submitted = call({
              'op': 'submit_spec',
              'spec': spec,
              'execute': False,
              'approve': False,
              'labels': ['styler'],
              'max_workers': 2,
          })
          run_id = submitted['run_id']
          for _ in range(200):
              status = call({'op': 'status', 'run_id': run_id})
              if status['status'] in {'succeeded', 'failed', 'cancelled', 'interrupted'}:
                  break
              time.sleep(0.025)
          assert status['status'] == 'succeeded', status
          report = call({'op': 'report', 'run_id': run_id})
          assert report['success'] is True, report
          print('structured spec IPC OK', run_id)
          PY

      - name: Package runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          install -m 0755 vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft artifact/pipecraft
          (cd artifact && sha256sum pipecraft > pipecraft.sha256)
          artifact/pipecraft --version
          cat artifact/pipecraft.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pipecraft-1.6.0-alpha.1-linux-x86_64
          path: artifact/
          if-no-files-found: error
