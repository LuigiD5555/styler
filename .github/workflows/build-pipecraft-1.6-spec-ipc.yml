name: Build PipeCraft 1.6 spec IPC

on:
  push:
    branches:
      - build/pipecraft-1.6.0-alpha.1-spec-ipc
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pipecraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply PipeCraft 1.6 spec IPC implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('vendor/pipecraft-1.5.0-alpha.1')

          cargo = root / 'Cargo.toml'
          s = cargo.read_text()
          s = s.replace('version = "1.5.0-alpha.1"', 'version = "1.6.0-alpha.1"', 1)
          cargo.write_text(s)

          loader = root / 'crates/pipecraft-core/src/loader.rs'
          s = loader.read_text()
          s = s.replace('            id: sid,\n', '            id: sid.clone(),\n', 1)
          start = s.index('pub fn load_pipeline(path: &Path) -> ConfigResult<PipelineDefinition> {')
          end = s.index('\nfn parse_steps(', start)
          block = s[start:end]
          prefix = 'pub fn load_pipeline(path: &Path) -> ConfigResult<PipelineDefinition> {\n    let raw = read_yaml(path)?;\n'
          if not block.startswith(prefix):
              raise SystemExit('unexpected load_pipeline layout')
          body = block[len(prefix):]
          if not body.rstrip().endswith('}'):
              raise SystemExit('unexpected load_pipeline end')
          body = body.rstrip()[:-1].rstrip() + '\n'
          body = body.replace('get(&raw,', 'get(raw,')
          body = body.replace('parse_steps(&raw,', 'parse_steps(raw,')
          body = body.replace('parse_error_policy(&raw)', 'parse_error_policy(raw)')
          replacement = '''pub fn load_pipeline(path: &Path) -> ConfigResult<PipelineDefinition> {
    let raw = read_yaml(path)?;
    parse_pipeline_value(&raw, path)
}

/// Load a pipeline from an already parsed value. This is the structured IPC
/// entry point: callers do not need to materialize a temporary YAML pipeline.
pub fn load_pipeline_value(raw: Value, source: &str) -> ConfigResult<PipelineDefinition> {
    let path = PathBuf::from(source);
    match raw {
        Value::Mapping(_) => parse_pipeline_value(&raw, &path),
        Value::Null => {
            let empty = Value::Mapping(Default::default());
            parse_pipeline_value(&empty, &path)
        }
        _ => Err(ConfigError::new(
            format!("Pipeline root must be a mapping: {source}"),
            "YAML_ROOT_ERROR",
        )
        .with_hint("The top level of a PipeCraft spec must be key/value pairs.")),
    }
}

fn parse_pipeline_value(raw: &Value, path: &Path) -> ConfigResult<PipelineDefinition> {
''' + body + '}\n'
          loader.write_text(s[:start] + replacement + s[end:])

          lib = root / 'crates/pipecraft-core/src/lib.rs'
          s = lib.read_text()
          s = s.replace(
              'pub use loader::{load_pipeline, load_workspace, PipelineCatalog};',
              'pub use loader::{load_pipeline, load_pipeline_value, load_workspace, PipelineCatalog};',
          )
          lib.write_text(s)

          protocol = root / 'crates/pipecraft-service/src/protocol.rs'
          s = protocol.read_text()
          marker = '    Status { run_id: String },\n'
          if marker not in s:
              raise SystemExit('protocol insertion marker missing')
          variants = '''    SubmitSpec {
        spec: Value,
        #[serde(default)]
        execute: bool,
        #[serde(default)]
        approve: bool,
        #[serde(default)]
        labels: Vec<String>,
        #[serde(default = "default_workers")]
        max_workers: usize,
        #[serde(default)]
        from_step: Option<String>,
        #[serde(default)]
        only: Vec<String>,
    },
    ValidateSpec { spec: Value },
    PlanSpec {
        spec: Value,
        #[serde(default)]
        from_step: Option<String>,
        #[serde(default)]
        only: Vec<String>,
    },
'''
          s = s.replace(marker, variants + marker, 1)
          protocol.write_text(s)

          server = root / 'crates/pipecraft-service/src/server.rs'
          s = server.read_text()
          s = s.replace(
              'use pipecraft_core::{load_pipeline, PipelineCatalog};',
              'use pipecraft_core::{load_pipeline, load_pipeline_value, PipelineCatalog};',
              1,
          )
          s = s.replace('const MAX_REQUEST_BYTES: usize = 1024 * 1024;', 'const MAX_REQUEST_BYTES: usize = 8 * 1024 * 1024;', 1)
          ping_marker = '                "recovery": if self.config.recovery == RecoveryPolicy::Auto { "auto" } else { "manual" },\n'
          if ping_marker not in s:
              raise SystemExit('ping marker missing')
          s = s.replace(
              ping_marker,
              ping_marker + '                "capabilities": ["submit_spec", "validate_spec", "plan_spec", "command", "plugin", "resume"],\n',
              1,
          )
          status_marker = '            IpcRequest::Status { run_id } => {\n'
          if status_marker not in s:
              raise SystemExit('server status marker missing')
          arms = r'''            IpcRequest::ValidateSpec { spec } => {
                let raw = serde_yaml::to_value(&spec).map_err(internal)?;
                let definition = match load_pipeline_value(raw, "<ipc-spec>") {
                    Ok(definition) => definition,
                    Err(error) => return Ok(json!({
                        "valid": false,
                        "errors": [error.to_string()],
                        "warnings": []
                    })),
                };
                let errors = self.engine.validate(&definition);
                Ok(json!({
                    "valid": errors.is_empty(),
                    "pipeline": definition.name,
                    "errors": errors,
                    "warnings": []
                }))
            }
            IpcRequest::PlanSpec { spec, from_step, only } => {
                let raw = serde_yaml::to_value(&spec).map_err(internal)?;
                let definition = load_pipeline_value(raw, "<ipc-spec>")
                    .map_err(|error| ("SPEC_INVALID".into(), error.to_string()))?;
                let order = self.engine.plan(&definition)
                    .map_err(|errors| ("PIPELINE_INVALID".into(), errors.join("; ")))?;
                let selected = select_requested_order(&order, from_step.as_deref(), &only)?;
                Ok(json!({
                    "valid": true,
                    "pipeline": definition.name,
                    "order": order,
                    "selected": selected,
                    "step_count": definition.steps.len()
                }))
            }
            IpcRequest::SubmitSpec { spec, execute, approve, labels, max_workers, from_step, only } => {
                let raw = serde_yaml::to_value(&spec).map_err(internal)?;
                let definition = load_pipeline_value(raw, "<ipc-spec>")
                    .map_err(|error| ("SPEC_INVALID".into(), error.to_string()))?;
                let errors = self.engine.validate(&definition);
                if !errors.is_empty() {
                    return Err(("PIPELINE_INVALID".into(), errors.join("; ")));
                }
                let pipeline = definition.name.clone();
                let run_id = self.make_run_id(&pipeline);
                let snapshot_path = self.persist_spec_snapshot(&run_id, &spec).await
                    .map_err(service_error)?;
                let request = JobRequest {
                    pipeline,
                    execute,
                    approve,
                    labels,
                    max_workers: max_workers.max(1),
                    from_step,
                    only,
                };
                let record = JobRecord::new(
                    run_id.clone(),
                    request,
                    &self.runs_dir,
                    &self.root,
                    snapshot_path.display().to_string(),
                );
                if let Err(error) = self.put_job(record).await {
                    let _ = tokio::fs::remove_file(&snapshot_path).await;
                    return Err(service_error(error));
                }
                self.start_existing(run_id.clone(), false).await.map_err(service_error)?;
                Ok(json!({"run_id": run_id, "status": "queued", "source": "structured-spec"}))
            }
'''
          s = s.replace(status_marker, arms + status_marker, 1)

          persist_marker = '    async fn start_existing(&self, run_id: String, resume: bool) -> Result<(), String> {\n'
          if persist_marker not in s:
              raise SystemExit('persist marker missing')
          persist = r'''    async fn persist_spec_snapshot(&self, run_id: &str, spec: &Value) -> Result<PathBuf, String> {
        use tokio::io::AsyncWriteExt;
        let text = serde_yaml::to_string(spec).map_err(|error| error.to_string())?;
        let run_dir = self.root.join(&self.runs_dir).join(run_id);
        tokio::fs::create_dir_all(&run_dir).await.map_err(|error| error.to_string())?;
        let path = run_dir.join("pipeline.snapshot.yaml");
        let tmp = run_dir.join(format!("pipeline.snapshot.yaml.tmp-{}", uuid::Uuid::new_v4().simple()));
        let mut file = tokio::fs::File::create(&tmp).await.map_err(|error| error.to_string())?;
        file.write_all(text.as_bytes()).await.map_err(|error| error.to_string())?;
        file.flush().await.map_err(|error| error.to_string())?;
        file.sync_all().await.map_err(|error| error.to_string())?;
        drop(file);
        tokio::fs::rename(&tmp, &path).await.map_err(|error| error.to_string())?;
        if let Ok(dir) = std::fs::File::open(&run_dir) { let _ = dir.sync_all(); }
        Ok(path)
    }

'''
          s = s.replace(persist_marker, persist + persist_marker, 1)

          helper_marker = '\nfn durable_copy(source: &Path, destination: &Path) -> std::io::Result<()> {\n'
          if helper_marker not in s:
              raise SystemExit('helper marker missing')
          helper = r'''
fn select_requested_order(
    order: &[String],
    from_step: Option<&str>,
    only: &[String],
) -> Result<Vec<String>, (String, String)> {
    let mut selected = order.to_vec();
    if let Some(from) = from_step {
        let Some(position) = selected.iter().position(|id| id == from) else {
            return Err(("FROM_STEP_NOT_FOUND".into(), format!("from_step not found: {from}")));
        };
        selected = selected[position..].to_vec();
    }
    if !only.is_empty() {
        let missing = only.iter().filter(|id| !order.contains(id)).cloned().collect::<Vec<_>>();
        if !missing.is_empty() {
            return Err(("ONLY_STEP_NOT_FOUND".into(), format!("only references missing steps: {}", missing.join(", "))));
        }
        selected.retain(|id| only.contains(id));
    }
    Ok(selected)
}
'''
          s = s.replace(helper_marker, helper + helper_marker, 1)
          server.write_text(s)
          PY

      - name: Format and test PipeCraft 1.6
        run: |
          cargo fmt --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --all
          cargo fmt --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --all -- --check
          cargo test --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml --workspace

      - name: Build PipeCraft 1.6.0-alpha.1
        run: cargo build --release --manifest-path vendor/pipecraft-1.5.0-alpha.1/Cargo.toml -p pipecraft-cli

      - name: Functional spec IPC smoke test
        shell: bash
        run: |
          set -euo pipefail
          PC="$PWD/vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft"
          ROOT="$(mktemp -d)"
          mkdir -p "$ROOT/.pipelines/pipelines"
          "$PC" --version
          "$PC" serve --root "$ROOT" >"$ROOT/service.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            test -S "$ROOT/.pipelines/pipecraft.sock" && break
            sleep 0.05
          done
          ROOT="$ROOT" python - <<'PY'
          import json, os, socket, time
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          endpoint = root / '.pipelines/pipecraft.sock'

          def call(payload):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.connect(str(endpoint))
              s.sendall((json.dumps(payload, separators=(',', ':')) + '\n').encode())
              data = b''
              while not data.endswith(b'\n'):
                  chunk = s.recv(65536)
                  if not chunk:
                      break
                  data += chunk
              s.close()
              value = json.loads(data)
              assert value['ok'], value
              return value['data']

          spec = {
              'schema_version': 'pipecraft/v1',
              'name': 'ipc-smoke',
              'steps': [
                  {'id': 'a', 'type': 'note', 'with': {'message': 'a'}},
                  {'id': 'b', 'type': 'note', 'needs': ['a'], 'with': {'message': 'b'}},
              ],
          }
          ping = call({'op': 'ping'})
          assert ping['version'] == '1.6.0-alpha.1', ping
          assert {'submit_spec', 'validate_spec', 'plan_spec'} <= set(ping['capabilities']), ping
          validated = call({'op': 'validate_spec', 'spec': spec})
          assert validated['valid'] is True, validated
          planned = call({'op': 'plan_spec', 'spec': spec})
          assert planned['order'] == ['a', 'b'], planned
          submitted = call({'op': 'submit_spec', 'spec': spec, 'execute': False, 'approve': False, 'labels': ['styler'], 'max_workers': 2})
          run_id = submitted['run_id']
          for _ in range(200):
              status = call({'op': 'status', 'run_id': run_id})
              if status['status'] in {'succeeded', 'failed', 'cancelled', 'interrupted'}:
                  break
              time.sleep(0.025)
          assert status['status'] == 'succeeded', status
          report = call({'op': 'report', 'run_id': run_id})
          assert report['success'] is True, report
          print('spec IPC smoke OK', run_id)
          PY

      - name: Package runtime
        run: |
          BIN=vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft
          file "$BIN"
          sha256sum "$BIN" > pipecraft.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pipecraft-1.6.0-alpha.1-linux-x86_64
          path: |
            vendor/pipecraft-1.5.0-alpha.1/target/release/pipecraft
            pipecraft.sha256
          if-no-files-found: error
